[package]
name = "boblm-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
boblm-tuning = { path = "../tuning" }
boblm-protocol = { path = "../protocol" }
boblm-store = { path = "../store" }
boblm-claude-driver = { path = "../claude-driver" }
boblm-codex-driver = { path = "../codex-driver" }
boblm-pi-driver = { path = "../pi-driver" }
tokio = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
